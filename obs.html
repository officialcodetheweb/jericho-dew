<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="robots" content="noindex">
<title>JERICHO DEW — Stream output</title>
<style>
@font-face { font-family: Lexend; src: url(fonts/lexend-latin-400-normal.woff2) format('woff2'); font-weight: 400; }
@font-face { font-family: Lexend; src: url(fonts/lexend-latin-500-normal.woff2) format('woff2'); font-weight: 500; }
@font-face { font-family: Lexend; src: url(fonts/lexend-latin-600-normal.woff2) format('woff2'); font-weight: 600; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
body { font-family: Lexend, system-ui, sans-serif; color: #fff; background: radial-gradient(1400px 900px at 50% 30%, #1d4fd8, #0b2266 50%, #040b20); }
body.transparent { background: transparent; }
.top { position: absolute; left: 48px; right: 48px; top: 36px; display: flex; align-items: center; gap: 18px; z-index: 5; }
.top img { width: 74px; height: 74px; object-fit: contain; }
.top .t b { display: block; font-size: 30px; font-weight: 600; }
.top .t span { font-size: 20px; color: #c8d6f7; }
.live { margin-left: auto; display: flex; align-items: center; gap: 10px; padding: 10px 20px; border-radius: 99px; background: rgba(239,75,93,.95); font-weight: 600; font-size: 20px; letter-spacing: .08em; }
.live i { width: 12px; height: 12px; border-radius: 50%; background: #fff; animation: p 1.4s infinite; }
@keyframes p { 50% { opacity: .3; } }
.stage { position: absolute; left: 48px; top: 140px; width: 1440px; height: 810px; border-radius: 22px; overflow: hidden; background: #000; box-shadow: 0 30px 70px -20px rgba(0,0,0,.8), 0 0 0 6px #11141b; display: none; }
.stage video { width: 100%; height: 100%; object-fit: contain; }
body.tv .stage { display: block; }
.side { position: absolute; right: 48px; top: 140px; width: 360px; height: 810px; display: none; flex-direction: column; gap: 14px; }
body.tv .side { display: flex; }
.side h4 { margin: 0 0 4px; font-weight: 500; font-size: 20px; color: #fba100; }
.spk { display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: 18px; background: rgba(6,16,44,.75); }
.spk .av, .big .av { border-radius: 50%; background: linear-gradient(135deg, #2a63f0, #1636a8) center/cover; display: grid; place-items: center; font-weight: 600; flex: none; }
.spk .av { width: 64px; height: 64px; font-size: 22px; box-shadow: 0 0 0 3px #fba100; }
.spk b { font-size: 22px; font-weight: 500; }
.center { position: absolute; inset: 140px 48px 170px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; }
body.tv .center { display: none; }
.center .logo { width: 300px; filter: drop-shadow(0 20px 50px rgba(0,0,0,.5)); }
.bigrow { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; max-width: 1700px; }
.big { display: grid; justify-items: center; gap: 12px; }
.big .av { width: 150px; height: 150px; font-size: 48px; box-shadow: 0 0 0 6px #fba100, 0 0 40px rgba(251,161,0,.5); }
.big b { font-size: 26px; font-weight: 500; }
.lower { position: absolute; left: 48px; bottom: 44px; display: none; align-items: center; gap: 22px; padding: 18px 40px 18px 18px; border-radius: 24px; background: rgba(6,16,44,.9); border-left: 10px solid #fba100; box-shadow: 0 20px 50px -20px #000; animation: in .6s cubic-bezier(.2,.9,.3,1.1); z-index: 6; }
body.min .lower { display: flex; }
body.tv .lower { bottom: 150px; left: 80px; }
@keyframes in { from { opacity: 0; transform: translateX(-40px); } }
.lower .av { width: 96px; height: 96px; border-radius: 50%; background: linear-gradient(135deg, #2a63f0, #1636a8) center/cover; display: grid; place-items: center; font-size: 34px; font-weight: 600; }
.lower span { display: block; color: #fba100; font-size: 20px; font-weight: 500; }
.lower b { display: block; font-size: 40px; font-weight: 600; line-height: 1.15; }
.lower em { display: block; font-style: normal; color: #c8d6f7; font-size: 22px; }
.msg { position: absolute; inset: 0; display: grid; place-items: center; font-size: 28px; color: #c8d6f7; text-align: center; padding: 40px; }
</style>
</head>
<body>
<div class="top"><img src="logo.png" alt=""><div class="t"><b id="title">JERICHO DEW</b><span id="church">Jericho Afasuo Prayer City</span></div><div class="live" id="live" hidden><i></i>LIVE</div></div>
<div class="stage"><video id="tv" autoplay playsinline muted></video></div>
<div class="side"><h4>Speaking now</h4><div id="sideList"></div></div>
<div class="center" id="center"><img class="logo" src="logo.png" alt=""><div class="bigrow" id="bigRow"></div></div>
<div class="lower" id="lower"><div class="av" id="lAv"></div><div><span>Now ministering</span><b id="lName"></b><em id="lTitle"></em></div></div>
<div class="msg" id="msg">Connecting to the service…</div>
<div id="sink" hidden></div>
<script src="livekit-client.umd.js"></script>
<script src="obs.js"></script>
</body>
</html>
